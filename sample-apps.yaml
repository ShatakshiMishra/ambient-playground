# Sample workloads for the ztunnel experiments.
#
#   - httpbin : an HTTP echo/inspection server (the "server")
#   - curl    : a long-running client pod you exec into to generate traffic
#
# Deployed into namespace "ambient-demo". The namespace is NOT enrolled into
# ambient here — experiment 01 enrolls it, so you can compare before/after.
#
# Each app has its own ServiceAccount so you get distinct SPIFFE identities,
# which matters for the L4 authorization experiment.
apiVersion: v1
kind: Namespace
metadata:
  name: ambient-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin
  namespace: ambient-demo
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: ambient-demo
  labels:
    app: httpbin
    service: httpbin
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8080
  selector:
    app: httpbin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: ambient-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      serviceAccountName: httpbin
      containers:
        - name: httpbin
          image: docker.io/mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
          args: ["-port", "8080"]
          readinessProbe:
            httpGet:
              path: /status/200
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: curl
  namespace: ambient-demo
---
apiVersion: v1
kind: Service
metadata:
  name: curl
  namespace: ambient-demo
  labels:
    app: curl
spec:
  ports:
    - name: http
      port: 80
  selector:
    app: curl
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curl
  namespace: ambient-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: curl
  template:
    metadata:
      labels:
        app: curl
    spec:
      serviceAccountName: curl
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          # Keep the pod alive so we can exec into it and generate traffic.
          command: ["sleep", "infinity"]
