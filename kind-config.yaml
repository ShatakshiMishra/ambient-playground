# kind cluster with 1 control-plane + 2 workers.
# Multiple worker nodes matter here: it forces cross-node traffic so you can
# observe the HBONE tunnel between two different ztunnel pods.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ztunnel-lab
nodes:
  - role: control-plane
  - role: worker
  - role: worker
